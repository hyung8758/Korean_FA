[build-system]
# PEP 639 SPDX license expressions and ``license-files`` require setuptools
# 77.0.3 or later.  Pin the build requirement accordingly so every isolated
# PyPI/CI build interprets the project metadata consistently.
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "koreanfa"
dynamic = ["version"]
description = "Korean and Japanese forced alignment with a Python API and command-line interface"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "ko-speech-tools[g2p]==0.1.0",
    "numpy>=1.26",
    "soundfile>=0.12",
    "soxr>=0.3",
]

license = "Apache-2.0 AND LicenseRef-Proprietary"
license-files = ["license", "THIRD_PARTY_NOTICES.md", "koreanfa/runtime/model/kor_model/NOTICE.md", "koreanfa/runtime/model/jap_model/NOTICE.md"]
authors = [{ name = "Hyungwon Yang" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
keywords = ["forced-alignment", "kaldi", "korean", "japanese", "textgrid", "speech"]

[project.urls]
Homepage = "https://github.com/hyung8758/Korean_FA"
Source = "https://github.com/hyung8758/Korean_FA"
Issues = "https://github.com/hyung8758/Korean_FA/issues"

[project.scripts]
koreanfa = "koreanfa.cli:main"

[project.optional-dependencies]
dev = [
    "build>=1.2,<2",
    "mypy>=1.11,<2",
    "pytest>=8.3,<10",
    "ruff>=0.9,<1",
    "twine>=5.1,<8",
]

[tool.setuptools]
packages = ["koreanfa"]
# Runtime is intentionally non-importable package data, not a collection of
# Python namespace packages.  Its complete file set is declared below.
include-package-data = false

[tool.setuptools.dynamic]
version = {attr = "koreanfa._version.__version__"}

[tool.setuptools.package-data]
koreanfa = ["engine_manifest.json", "path.sh", "py.typed", "runtime/**/*"]

[tool.setuptools.exclude-package-data]
koreanfa = ["runtime/pipeline/__pycache__/*", "runtime/**/*.pyc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.12"
files = ["koreanfa"]
strict = true
pretty = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["ko_speech_tools", "ko_speech_tools.*", "soundfile", "soxr"]
ignore_missing_imports = true
