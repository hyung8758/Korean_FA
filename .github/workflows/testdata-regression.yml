name: Test data regression

# The full corpus exercises the released Linux engine and takes several
# minutes, so it runs before merge rather than on every feature-branch push.
on:
  pull_request:
    branches: [master]
    paths:
      - ".github/workflows/testdata-regression.yml"
      - "engine/alignment_labels.py"
      - "engine/verify_testdata_regression.py"
      - "koreanfa/**"
      - "MANIFEST.in"
      - "pyproject.toml"
      - "setup.py"
  workflow_dispatch:

concurrency:
  group: testdata-regression-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TESTDATA_VERSION: "1.0.0"
  TESTDATA_SHA256: "4b38fb1c091340231debfd2d97c33c56be99fb2c66c57d3318cf36eccd8994c5"
  TESTDATA_URL: "https://github.com/hyung8758/Korean_FA_testdata/releases/download/v1.0.0/koreanfa-testdata-v1.0.0.tar.gz"

jobs:
  verify-linux-x86_64:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install KoreanFA from the proposed source
        run: |
          python -m pip install --upgrade pip
          python -m pip install .

      - name: Install the released Linux engine
        env:
          KOREANFA_ENGINE_HOME: ${{ runner.temp }}/koreanfa-engine
        run: python -m koreanfa engine install

      - name: Download and verify immutable test data
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/koreanfa-testdata-v$TESTDATA_VERSION.tar.gz"
          curl \
            --fail \
            --location \
            --retry 3 \
            --retry-all-errors \
            --output "$archive" \
            "$TESTDATA_URL"
          printf '%s  %s\n' "$TESTDATA_SHA256" "$archive" | sha256sum --check --strict
          python - "$archive" "$RUNNER_TEMP/testdata" "koreanfa-testdata-v$TESTDATA_VERSION" <<'PY'
          import sys
          import tarfile
          from pathlib import Path

          archive, destination = map(Path, sys.argv[1:3])
          expected_root = sys.argv[3]
          destination.mkdir()
          with tarfile.open(archive, "r:gz") as bundle:
              members = bundle.getmembers()
              roots = {Path(member.name).parts[0] for member in members if Path(member.name).parts}
              if roots != {expected_root}:
                  raise RuntimeError(f"Unexpected archive roots: {sorted(roots)}")
              if any(not (member.isfile() or member.isdir()) for member in members):
                  raise RuntimeError("Test data archive contains a link or special file")
              bundle.extractall(destination, filter="data")
          PY

      - name: Align all normal and expected-failure fixtures
        env:
          KOREANFA_ENGINE_HOME: ${{ runner.temp }}/koreanfa-engine
        run: |
          python engine/verify_testdata_regression.py \
            "$RUNNER_TEMP/testdata/koreanfa-testdata-v$TESTDATA_VERSION" \
            "$RUNNER_TEMP/testdata-results" \
            --num-jobs 4

      - name: Preserve diagnostics after a failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: koreanfa-testdata-regression-diagnostics
          path: ${{ runner.temp }}/testdata-results
          if-no-files-found: ignore
          retention-days: 7
