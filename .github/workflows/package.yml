name: Python package CI

on:
  push:
    branches: ["feat/**", "fix/**"]

# Run the lightweight package checks for every feature/fix branch update. A
# newer commit cancels an obsolete run from the same branch.
concurrency:
  group: python-package-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install . build pytest twine
      - run: python -m pytest
      - name: Build source and wheel distributions
        run: python -m build --outdir dist
      - name: Validate distribution metadata and upload size
        run: |
          twine check dist/*
          python - <<'PY'
          from pathlib import Path

          maximum_size = 100 * 1024 * 1024
          for artifact in Path("dist").iterdir():
              assert artifact.stat().st_size < maximum_size, f"PyPI default file limit exceeded: {artifact}"
          PY
      - name: Install the built wheel in an isolated environment
        run: |
          python -m venv "$RUNNER_TEMP/koreanfa-wheel-check"
          "$RUNNER_TEMP/koreanfa-wheel-check/bin/pip" install --upgrade pip
          "$RUNNER_TEMP/koreanfa-wheel-check/bin/pip" install dist/*.whl
          (
            cd "$RUNNER_TEMP"
            "$RUNNER_TEMP/koreanfa-wheel-check/bin/python" - <<'PY'
          from koreanfa import __version__
          from koreanfa.resources import runtime_root

          root = runtime_root()
          for relative in ("pipeline/forced_align.sh", "pipeline/main_fa.sh", "pipeline/prepare.sh", "languages/kor/profile.sh", "model/kor_model/final.mdl", "model/kor_model/NOTICE.md", "model/jap_model/final.mdl", "model/jap_model/NOTICE.md"):
              assert (root / relative).exists(), root / relative
          print(__version__)
          PY
          )
      - name: Save wheel for inspection
        uses: actions/upload-artifact@v4
        with:
          name: koreanfa-wheel-py312
          path: dist/*
          if-no-files-found: error
          retention-days: 14
